<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASBO - AI Studio Builder & Operator</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="sidebar-left">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="control">🎮 Control</button>
                <button class="tab-btn" data-tab="git">🌿 Git</button>
            </div>

            <div class="tab-panel active" id="tab-control">
                <!-- Working Directory -->
                <div class="control-section">
                    <div class="section-header">📁 Workspace Root</div>
                    <div class="workspace-selector">
                        <select id="workspace-select" class="workspace-dropdown">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>

                <!-- Context Pulse -->
                <div class="control-section">
                    <div class="section-header">📡 Context Pulse</div>
                    <div class="pulse-container">
                        <div class="pulse-bar-bg">
                            <div id="pulse-fill" class="pulse-bar-fill" style="width: 0%;"></div>
                        </div>
                        <div class="pulse-meta">
                            <span id="pulse-count">0</span> / 200k <span class="pulse-unit">tokens</span>
                        </div>
                    </div>
                </div>

                <!-- Macro Grid -->
                <div class="control-section">
                    <div class="section-header">⌨️ Quick Macros</div>
                    <div class="macro-grid">
                        <button class="macro-btn" data-prompt="Create a project index for the current workspace by running: python -c \"from venice.project_index import ProjectIndex; ProjectIndex()\"">
                            <span class="macro-icon">🗂️</span>
                            <span class="macro-text">Index</span>
                        </button>
                        <button class="macro-btn" data-prompt="python3 gondola_v2.2/venice_cli_v2.py --forget">
                            <span class="macro-icon">🗑️</span>
                            <span class="macro-text">Forget</span>
                        </button>
                        <button class="macro-btn" data-prompt="Check all Python files for proper modular structure and circular dependencies.">
                            <span class="macro-icon">🧹</span>
                            <span class="macro-text">Audit</span>
                        </button>
                        <button class="macro-btn" data-prompt="Read the latest changes and update the README.md to reflect the new architecture.">
                            <span class="macro-icon">📝</span>
                            <span class="macro-text">Doc</span>
                        </button>
                        <button class="macro-btn" data-prompt="List all files and summarize the project state.">
                            <span class="macro-icon">🔍</span>
                            <span class="macro-text">Status</span>
                        </button>
                        <button class="macro-btn" data-prompt="Analyze the codebase for potential bugs or errors. Suggest fixes for the most critical issue found.">
                            <span class="macro-icon">🐞</span>
                            <span class="macro-text">Debug</span>
                        </button>
                        <button class="macro-btn" data-prompt="Identify and delete temporary files (__pycache__, .DS_Store, *.log, etc) to clean the workspace.">
                            <span class="macro-icon">🧹</span>
                            <span class="macro-text">Clean</span>
                        </button>
                        <button class="macro-btn" data-prompt="Remember how you did that with the save_knowledge tool">
                            <span class="macro-icon">💾</span>
                            <span class="macro-text">Remember</span>
                        </button>
                    </div>
                </div>

                <!-- Manual Session Save -->
                <div class="control-section">
                    <button id="save-session-btn" class="save-session-btn">
                        <span class="macro-icon">💾</span> Save Session
                    </button>
                </div>

                <!-- Tool Visibility Toggle -->
                <div class="control-section">
                    <label class="toggle-row">
                        <input type="checkbox" id="auto-expand-tools">
                        <span>Auto-expand tool output</span>
                    </label>
                </div>
            </div>

            <div class="tab-panel" id="tab-git">
                <div class="control-section">
                    <div class="section-header">🌿 Git Tree</div>
                    <div id="git-tree-log" class="git-tree-log">
                        Loading tree...
                    </div>
                </div>

                <div class="control-section">
                    <div class="section-header">🌿 Git Status</div>
                    <div id="git-status-info" class="git-status-info">
                        <!-- Populated by JS -->
                    </div>
                    <div id="git-status-log" class="git-log">
                        Initializing...
                    </div>
                </div>

                <div class="control-section">
                    <div class="git-actions-grid">
                        <button id="git-refresh" class="btn-tiny">Refresh</button>
                        <button id="git-diff-btn" class="btn-tiny">Diff</button>
                        <button id="git-commit-btn" class="btn-tiny">Commit</button>
                        <button id="git-branch-btn" class="btn-tiny">New Branch</button>
                        <button id="git-checkout-btn" class="btn-tiny">Checkout</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="splitter-left" class="splitter-vertical"></div>

        <!-- Middle: Chat Interface -->
        <div class="main-content">
            <div class="chat-section">
                <div class="chat-header">
                    <div class="header-left">
                        <h2>ASBO</h2>
                        <span id="agent-status" class="status-indicator">Community Service</span>
                    </div>
                    <div class="header-center">
                        <span id="model-rank-badge"></span>
                        <select id="model-select" class="model-dropdown">
                            <!-- Populated by JS -->
                        </select>
                        <span id="model-price-badge"></span>
                    </div>
                    <div class="header-actions">
                        <button id="clear-chat" class="btn-secondary">Clear Chat</button>
                    </div>
                </div>
                <div id="chat-history" class="chat-history">
                    <div class="message system">
                        <p>Welcome to <strong>ASBO</strong>. I'm immortal, and I have full access to the sandbox files. Let's make some beautiful screw-ups.</p>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-row">
                        <div class="file-upload-wrapper">
                            <input type="file" id="image-input" accept="image/*" class="hidden">
                            <button type="button" id="upload-btn" class="file-upload-btn" title="Attach image for vision analysis">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                <span class="file-cancel-badge" id="remove-image">&times;</span>
                            </button>
                            <button type="button" id="screenshot-btn" class="file-upload-btn" title="Take Screenshot">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                            </button>
                            <button type="button" id="planning-mode-btn" class="file-upload-btn planning-btn" title="Toggle Planning Mode (Read-only)">
                                <span>P</span>
                                <div class="chase-indicator">
                                    <div class="chase-right"></div>
                                    <div class="chase-bottom"></div>
                                    <div class="chase-left"></div>
                                </div>
                            </button>
                        </div>
                        <div class="input-wrapper">
                            <div class="input-expander">
                                <div class="chase-bottom"></div>
                                <div class="chase-left"></div>
                                <textarea id="user-input" placeholder="Describe a task (e.g., 'Create a flask app in app.py')..." rows="1"></textarea>
                            </div>
                        </div>
                        <button id="send-btn" class="action-btn-main">
                            <svg id="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                        </button>
                    </div>
                    <div id="image-preview-container" class="image-preview-container" style="display: none;">
                        <img id="image-preview" class="image-preview">
                        <button id="remove-image" class="btn-remove-image" title="Remove image">✕</button>
                        <span id="image-name" class="image-name"></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="splitter-right" class="splitter-vertical"></div>

        <div class="sidebar-right">
            <div class="sidebar-tabs">
                <button class="tab-btn" data-tab="editor">🎨 Editor</button>
                <button class="tab-btn active" data-tab="backups">💾 Backups</button>
            </div>
            <div class="tab-panel" id="tab-editor">
                <div class="image-editor-panel">
                    <div class="editor-upload-area" id="editor-upload-area">
                        <label class="editor-dropzone" id="editor-dropzone">
                            <input type="file" id="editor-image-input" accept="image/*" hidden>
                            <div class="dropzone-content">
                                <span class="dropzone-icon">📤</span>
                                <span class="dropzone-text">Enter prompt to generate or click to upload</span>
                            </div>
                        </label>
                    </div>
                    <div class="editor-preview-area" id="editor-preview-area" style="display: none;">
                        <img id="editor-source-image" class="editor-image">
                        <button id="editor-clear-image" class="btn-tiny">✕ Clear</button>
                    </div>
                    <div class="editor-prompt-area">
                        <textarea id="editor-prompt" placeholder="Describe the edit (e.g., 'Change sky to sunset', 'Remove background')..." rows="2"></textarea>
                        <button id="editor-submit" class="btn-primary" disabled>✨ Generate/Edit</button>
                    </div>
                    <div class="editor-result-area" id="editor-result-area" style="display: none;">
                        <div class="result-header">
                            <span>Result</span>
                            <button id="editor-download" class="btn-tiny">⬇ Download</button>
                        </div>
                        <img id="editor-result-image" class="editor-image">
                    </div>
                    <div class="editor-status" id="editor-status"></div>
                </div>
            </div>
            <div class="tab-panel active" id="tab-backups">
                <div class="backups-panel">
                    <div class="backups-header">
                        <button id="refresh-backups" class="btn-icon" title="Refresh">↻</button>
                        <span class="backup-count" id="backup-count">0 backups</span>
                    </div>
                    <div class="backups-list" id="backups-list">
                        <!-- Populated by JS -->
                    </div>
                    <div class="session-history">
                        <div class="session-header">📜 Session History</div>
                        <div class="session-list" id="session-list">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
